[project]
name = "xiezuomanju-api"
version = "0.2.0"
description = "AI 商业化写作台Always-On-MultiAgents FastAPI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "sqlmodel>=0.0.22",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-multipart>=0.0.20",
  "httpx>=0.28.0",
  "redis>=5.2.0",
  "cryptography>=44.0.0",
  "python-docx>=1.1.2",
  "minio>=7.2.0",
  "lark-oapi>=1.4.0",
  "reportlab>=5.1.0",
  "pypdf>=7.1.1",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "httpx>=0.28.0", "pytest-asyncio>=0.25.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
