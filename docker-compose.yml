services:
  # —— core（本地默认）：pnpm docker:up → 仅 Redis ——
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # —— heavy（可选）：pnpm docker:up:heavy → MinIO + etcd + Milvus ——
  minio:
    profiles: ["heavy"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    profiles: ["heavy"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/xiezuomanju || true;
      mc anonymous set download local/xiezuomanju/public || true;
      exit 0;
      "

  etcd:
    profiles: ["heavy"]
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcddata:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    profiles: ["heavy"]
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "false"
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      COMMON_STORAGETYPE: remote
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - milvusdata:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10

  # —— 应用进程（可选）：docker compose --profile app up -d ——
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: sqlite:////data/dev.db
      REDIS_URL: redis://redis:6379/0
      LOCAL_API_REQUIRE_TOKEN: "true"
      LOCAL_API_TOKEN: ${LOCAL_API_TOKEN:-}
      USE_PI_AGENT_WORKER: "true"
      MINIO_ENDPOINT: minio:9000
      MILVUS_URI: http://milvus:19530
    volumes:
      - dbdata:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  job-worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: sqlite:////data/dev.db
      REDIS_URL: redis://redis:6379/0
      USE_PI_AGENT_WORKER: "true"
      AGENT_DEFER_TO_PI: "true"
      PYTHONPATH: /app:/job-worker
    working_dir: /app
    # 镜像已 COPY /job-worker；volumes 仅热更新，缺挂载时仍可跑
    command: ["uv", "run", "python", "/job-worker/main.py"]
    volumes:
      - ./services/job-worker:/job-worker:ro
      - ./packages:/packages:ro
      - ./knowledge:/knowledge:ro
      - dbdata:/data
    depends_on:
      - api
      - redis

  agent-worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/agent-worker/Dockerfile
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      API_BASE: http://api:8000
      LOCAL_API_TOKEN: ${LOCAL_API_TOKEN:-}
      JOB_AGENT_QUEUE_KEY: jobs:agent
      # 官方默认：自研 tool loop；需要实验 Pi 时再设 AGENT_USE_PI=true
      AGENT_USE_PI: "false"
    depends_on:
      - api
      - redis

  scheduler:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: sqlite:////data/dev.db
      REDIS_URL: redis://redis:6379/0
      SCHEDULER_INTERVAL_S: "60"
      PYTHONPATH: /app:/scheduler
    command: ["uv", "run", "python", "/scheduler/main.py"]
    volumes:
      - ./services/scheduler:/scheduler:ro
      - ./packages:/packages:ro
      - dbdata:/data
    depends_on:
      - api
      - redis

volumes:
  dbdata:
  redisdata:
  miniodata:
  etcddata:
  milvusdata:
