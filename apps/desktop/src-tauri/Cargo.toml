[package]
name = "xiezuomanju-desktop"
version = "0.1.0"
description = "AI 商业写作台 desktop shell"
authors = ["xiezuomanju"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "xiezuomanju_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
